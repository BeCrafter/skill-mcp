name: Create Release Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Extract version from branch name
        id: extract_version
        run: |
          VERSION="${GITHUB_HEAD_REF#release/v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Synchronize version in package.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.extract_version.outputs.version }}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "📝 Updating package.json version from $PACKAGE_VERSION to $TAG_VERSION"
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): sync version to v$TAG_VERSION"
            git push origin main || {
              echo "⚠️  Push failed, attempting to sync with remote..."
              git fetch origin main
              git rebase origin/main
              git push origin main
            }
          else
            echo "✅ package.json version already matches: $PACKAGE_VERSION"
          fi

      - name: Update CHANGELOG
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          DATE=$(date +"%Y-%m-%d")

          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "✅ CHANGELOG already contains version $VERSION"
          else
            echo "📝 Adding version entry to CHANGELOG"

            # Create new entry using printf
            printf '## [%s] - %s\n\n### Added\n- New features and improvements\n\n### Changed\n- Bug fixes and improvements\n\n---\n\n' "$VERSION" "$DATE" > /tmp/changelog_new.txt

            # Insert after Unreleased section
            sed -i '/^## \[Unreleased\]/r /tmp/changelog_new.txt' CHANGELOG.md

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): update CHANGELOG for v$VERSION"
            git push origin main || {
              echo "⚠️  CHANGELOG push failed, attempting to sync with remote..."
              git fetch origin main
              git rebase origin/main
              git push origin main
            }

            rm -f /tmp/changelog_new.txt
          fi
        continue-on-error: true

      - name: Create and push tag
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "⚠️  Tag v$VERSION already exists, skipping tag creation"
          else
            echo "🏷️  Creating tag v$VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Verify package.json after sync
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.extract_version.outputs.version }}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch after sync!"
            echo "package.json version: $PACKAGE_VERSION"
            echo "Tag version: $TAG_VERSION"
            exit 1
          fi

          echo "✅ Final verification passed - version: $PACKAGE_VERSION"

      - name: Comment on PR
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          gh pr comment ${{ github.event.pull_request.number }} --body "🚀 Release tag \`v$VERSION\` created! The package will be published to npm shortly.\n\n**Install command:**\n\`\`\`bash\nnpm install -g skill-mcp@$VERSION\n\`\`\`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}