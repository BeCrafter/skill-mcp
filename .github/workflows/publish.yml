name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'           # v1.0.0
      - 'v*.*.*-*'        # v1.0.0-alpha.1, v1.0.0-beta.1, v1.0.0-rc.1, v1.0.0-dev.1
  workflow_dispatch:      # 允许手动触发

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 需要创建 GitHub Release
      id-token: write     # 用于 OIDC 认证（可选）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Auth to npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Install dependencies
        run: npm install --force

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript compiler
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify build artifacts
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Build failed: dist/index.js not found"
            exit 1
          fi

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Determine npm tag
        id: determine_npm_tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"  # 移除 v 前缀

          if [[ "$VERSION" == *"-"* ]]; then
            if [[ "$VERSION" == *"-dev."* ]]; then
              NPM_TAG="dev"
              IS_PRERELEASE="true"
              PRERELEASE_TYPE="开发版本 (Dev)"
            elif [[ "$VERSION" == *"-alpha."* ]]; then
              NPM_TAG="alpha"
              IS_PRERELEASE="true"
              PRERELEASE_TYPE="Alpha 测试版"
            elif [[ "$VERSION" == *"-beta."* ]]; then
              NPM_TAG="beta"
              IS_PRERELEASE="true"
              PRERELEASE_TYPE="Beta 测试版"
            elif [[ "$VERSION" == *"-rc."* ]]; then
              NPM_TAG="rc"
              IS_PRERELEASE="true"
              PRERELEASE_TYPE="候选发布版 (RC)"
            else
              NPM_TAG="next"
              IS_PRERELEASE="true"
              PRERELEASE_TYPE="预发布版"
            fi
          else
            NPM_TAG="latest"
            IS_PRERELEASE="false"
            PRERELEASE_TYPE="正式版"
          fi

          echo "npm_tag=$NPM_TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "prerelease_type=$PRERELEASE_TYPE" >> $GITHUB_OUTPUT

          echo "📦 Publishing version: $VERSION"
          echo "🏷️  npm tag: $NPM_TAG"
          echo "🔖 Type: $PRERELEASE_TYPE"

      - name: Sync package.json version with tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.extract_version.outputs.version }}"
          TAG_VERSION="${TAG_VERSION#v}"  # 移除 v 前缀

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "⚠️  Version mismatch detected!"
            echo "package.json version: $PACKAGE_VERSION"
            echo "Git tag version: $TAG_VERSION"
            echo "📝 Syncing package.json version to match tag..."
            npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore(release): sync version to v$TAG_VERSION [skip ci]"

            # 使用 --force-with-lease 推送以处理 detached HEAD 状态
            # 这比 --force 更安全，因为它会检查远程分支是否有新提交
            git push origin HEAD:main --force-with-lease || {
              # 如果推送失败，fetch 最新的 main 分支后重试
              echo "⚠️  Push failed, attempting to sync with remote..."
              git fetch origin main
              git push origin HEAD:main --force-with-lease
            }
            echo "✅ package.json updated and committed: v$TAG_VERSION"
          else
            echo "✅ Version already matches: $PACKAGE_VERSION"
          fi

      - name: Publish to npm
        run: npm publish --access public --tag ${{ steps.determine_npm_tag.outputs.npm_tag }} --ignore-scripts

      - name: Create GitHub Release
        if: steps.determine_npm_tag.outputs.npm_tag == 'latest' || steps.determine_npm_tag.outputs.npm_tag == 'rc'
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## ${{ steps.determine_npm_tag.outputs.prerelease_type }} ${{ steps.extract_version.outputs.version }}

            ### 安装
            ```bash
            npm install -g skill-mcp@${{ steps.extract_version.outputs.version }}
            ```

            ### 更新日志
            请查看 [CHANGELOG.md](https://github.com/BeCrafter/skill-mcp/blob/main/CHANGELOG.md) 获取详细的更新信息。

            ---
            发布时间: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: ${{ steps.determine_npm_tag.outputs.is_prerelease == 'true' }}
          name: ${{ steps.extract_version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify success
        run: |
          echo "✅ Published successfully!"
          echo "Version: ${{ steps.extract_version.outputs.version }}"
          echo "npm tag: ${{ steps.determine_npm_tag.outputs.npm_tag }}"
          echo "Package: https://www.npmjs.com/package/skill-mcp"

      - name: Notify prerelease success (no GitHub Release)
        if: steps.determine_npm_tag.outputs.npm_tag != 'latest' && steps.determine_npm_tag.outputs.npm_tag != 'rc'
        run: |
          echo "✅ Prerelease published successfully!"
          echo "Version: ${{ steps.extract_version.outputs.version }}"
          echo "npm tag: ${{ steps.determine_npm_tag.outputs.npm_tag }}"
          echo "Install: npm install -g skill-mcp@${{ steps.determine_npm_tag.outputs.npm_tag }}"
          echo "Package: https://www.npmjs.com/package/skill-mcp"