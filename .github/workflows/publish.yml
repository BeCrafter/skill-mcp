name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'           # v1.0.0
      - 'v*.*.*-*'        # v1.0.0-alpha.1, v1.0.0-beta.1, v1.0.0-rc.1, v1.0.0-dev.1
  workflow_dispatch:      # 允许手动触发(需基于带 tag 的提交)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 需要创建 GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (preflight + publish)
        run: ./scripts/release.sh

      # 仅 stable 与 rc 创建 GitHub Release;alpha/beta/dev/next 只发 npm。
      - name: Create GitHub Release
        if: ${{ !contains(github.ref_name, '-') || contains(github.ref_name, '-rc.') }}
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ```bash
            npm install -g skill-mcp@${{ github.ref_name }}
            ```

            ### 更新日志
            请查看 [CHANGELOG.md](https://github.com/BeCrafter/skill-mcp/blob/main/CHANGELOG.md) 获取详细的更新信息。
