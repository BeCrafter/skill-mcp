name: Create Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Get latest version
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 --exclude='rc/*' 2>/dev/null || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump version (patch)
        id: bump_version
        run: |
          CURRENT="${{ steps.get_version.outputs.version }}"
          # 移除 v 前缀（如果存在）
          CURRENT="${CURRENT#v}"
          # 解析版本号 (假设格式为 x.y.z)
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in package.json
        run: npm version "${{ steps.bump_version.outputs.version }}" --no-git-tag-version

      - name: Create release branch
        run: |
          BRANCH_NAME="release/v${{ steps.bump_version.outputs.version }}"
          git checkout -b "$BRANCH_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.bump_version.outputs.version }}"
          git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        run: |
          gh pr create \
            --base main \
            --head "release/v${{ steps.bump_version.outputs.version }}" \
            --title "Release v${{ steps.bump_version.outputs.version }}" \
            --body "## Release v${{ steps.bump_version.outputs.version }}

            This PR updates the version to ${{ steps.bump_version.outputs.version }}. Once merged, the tag will be created and the package will be published to npm.

            ### Checklist
            - [ ] All tests pass
            - [ ] Documentation is up to date
            - [ ] CHANGELOG.md is updated
            - [ ] No breaking changes without documentation
            " \
            --label "release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}