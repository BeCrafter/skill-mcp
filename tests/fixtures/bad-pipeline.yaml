name: bad-pipeline
inputs:
  text:
    type: string
    required: true
stages:
  a:
    skill: test-skill
    depends_on: [b]
    inputs:
      text: ${{ inputs.text }}
  b:
    skill: test-skill
    depends_on: [a]
    inputs:
      text: ${{ stages.a.outputs.result }}
output:
  final: ${{ stages.b.outputs.result }}
