
# Skill MCP Server - Docker Compose配置
# 支持全部 5 种部署场景
#
# 使用方法：
#   C1 单体:         docker compose --profile c1 up -d
#   C1 + HTTPS:      MCP_BACKEND=app:3000 STORAGE_BACKEND=app:3000 docker compose --profile c1-gateway up -d
#   B 远程后端:      docker compose --profile backend up -d
#   C2 分布式:       docker compose --profile c2 up -d
#   C2 + HTTPS 网关: docker compose --profile c2 --profile gateway up -d

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_PATH: ${DATABASE_PATH:-/data/skill-mcp.db}
  CACHE_FILE_DIR: ${CACHE_FILE_DIR:-/data/cache}
  SECURITY_INJECTION_SCAN: ${SECURITY_INJECTION_SCAN:-true}

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s

services:
  # ============================================================
  # 场景 C1：单体部署（开发/测试）
  # 场景 C1-gateway：单体 + HTTPS 网关
  # ============================================================
  app:
    image: ${IMAGE:-skill-mcp:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/index.js", "serve"]
    profiles: ["c1", "c1-gateway"]
    ports:
      - "${PORT:-3000}:3000"
    environment:
      <<: *common-env
      TRANSPORT_TYPE: http
      TRANSPORT_PORT: 3000
      STORAGE_TYPE: ${STORAGE_TYPE:-local-fs}
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/data/skills}
    volumes:
      - app-data:/data
    networks:
      - default
      - external
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]

  # ============================================================
  # 场景 B：远程后端（API-only，供 stdio proxy 使用）
  # ============================================================
  backend:
    image: ${IMAGE:-skill-mcp:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/index.js", "serve"]
    profiles: ["backend"]
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    environment:
      <<: *common-env
      TRANSPORT_TYPE: http
      TRANSPORT_PORT: 3000
      API_ONLY_MODE: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local-fs}
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/data/skills}
    volumes:
      - backend-data:/data
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]

  # ============================================================
  # 场景 C2：分布式部署（生产推荐）
  # ============================================================
  storage:
    image: ${IMAGE:-skill-mcp:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/index.js", "serve"]
    profiles: ["c2"]
    restart: always
    environment:
      <<: *common-env
      TRANSPORT_TYPE: http
      TRANSPORT_PORT: 3000
      API_ONLY_MODE: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local-fs}
      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/data/skills}
    volumes:
      - storage-data:/data
    networks:
      - internal
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    deploy:
      resources:
        limits:
          cpus: '${STORAGE_CPU:-2}'
          memory: ${STORAGE_MEM:-4G}
        reservations:
          cpus: '1'
          memory: 2G

  mcp:
    image: ${IMAGE:-skill-mcp:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/index.js", "serve"]
    profiles: ["c2"]
    restart: always
    ports:
      - "${MCP_PORT:-4000}:4000"
    environment:
      <<: *common-env
      TRANSPORT_TYPE: http
      TRANSPORT_PORT: 4000
      CLOUD_SERVICE_URL: http://storage:3000
      SKILL_MCP_AUTH_TOKEN: ${STORAGE_SVC_TOKEN:-changeme}
      MCP_ONLY_MODE: "true"
    volumes:
      - mcp-cache:/data
    networks:
      - internal
      - external
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
    deploy:
      replicas: ${MCP_REPLICAS:-2}
      resources:
        limits:
          cpus: '${MCP_CPU:-1}'
          memory: ${MCP_MEM:-2G}
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================================
  # Caddy 网关（自动 HTTPS）
  # 配合 c2 + gateway 或 c1-gateway 使用
  # ============================================================
  gateway:
    image: caddy:2-alpine
    profiles: ["gateway", "c1-gateway"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MCP_BACKEND=${MCP_BACKEND:-mcp:4000}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-storage:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - external
    depends_on:
      mcp:
        condition: service_healthy
        required: false
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/api/health"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  app-data:
  backend-data:
  storage-data:
  mcp-cache:
  caddy-data:
  caddy-config:

networks:
  default:
  internal:
    internal: true
  external:
