{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skill-mcp.fullname" . }}
  labels:
    {{- include "skill-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.authToken }}
  SKILL_MCP_AUTH_TOKEN: {{ .Values.secrets.authToken | quote }}
  {{- end }}
  {{- if .Values.secrets.gatewayAuthToken }}
  AUTH_TOKEN: {{ .Values.secrets.gatewayAuthToken | quote }}
  {{- end }}
  {{- if eq .Values.config.storage.type "aliyun-oss" }}
  ALIYUN_ACCESS_KEY_ID: {{ .Values.secrets.aliyun.accessKeyId | quote }}
  ALIYUN_ACCESS_KEY_SECRET: {{ .Values.secrets.aliyun.accessKeySecret | quote }}
  {{- end }}
{{- end }}
