apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skill-mcp.fullname" . }}
  labels:
    {{- include "skill-mcp.labels" . | nindent 4 }}
data:
  # Non-secret runtime config — projected into the container as env vars.
  NODE_ENV: production
  DEPLOYMENT_MODE: {{ .Values.config.deploymentMode | quote }}
  MCP_ONLY_MODE: {{ .Values.config.mcpOnlyMode | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  STORAGE_TYPE: {{ .Values.config.storage.type | quote }}
  STORAGE_BASE_PATH: {{ .Values.config.storage.basePath | quote }}
  {{- if eq .Values.config.storage.type "aliyun-oss" }}
  ALIYUN_BUCKET: {{ .Values.config.storage.bucket | quote }}
  ALIYUN_REGION: {{ .Values.config.storage.region | quote }}
  {{- end }}
  DATABASE_PATH: {{ .Values.config.database.path | quote }}
  DATABASE_TIMEOUT: {{ .Values.config.database.timeoutMs | quote }}
  TRANSPORT_TYPE: {{ .Values.config.transport.type | quote }}
  TRANSPORT_PORT: {{ .Values.config.transport.port | quote }}
  TRANSPORT_HOST: {{ .Values.config.transport.host | quote }}
  CACHE_MEMORY_ENABLED: {{ .Values.config.cache.memoryEnabled | quote }}
  CACHE_MEMORY_MAX_SIZE: {{ .Values.config.cache.memoryMaxSize | quote }}
  CACHE_FILE_ENABLED: {{ .Values.config.cache.fileEnabled | quote }}
  CACHE_FILE_DIR: {{ .Values.config.cache.fileDir | quote }}
  CACHE_L2_TTL_MULTIPLIER: {{ .Values.config.cache.l2TtlMultiplier | quote }}
  SECURITY_INJECTION_SCAN: {{ .Values.config.security.injectionScan | quote }}
  SECURITY_HSTS_ENABLED: {{ .Values.config.security.hstsEnabled | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.config.rateLimit.enabled | quote }}
  RATE_LIMIT_ADMIN_CAPACITY: {{ .Values.config.rateLimit.adminCapacity | quote }}
  RATE_LIMIT_ADMIN_REFILL_PER_SEC: {{ .Values.config.rateLimit.adminRefillPerSec | quote }}
  RATE_LIMIT_GATEWAY_CAPACITY: {{ .Values.config.rateLimit.gatewayCapacity | quote }}
  RATE_LIMIT_GATEWAY_REFILL_PER_SEC: {{ .Values.config.rateLimit.gatewayRefillPerSec | quote }}
  {{- if eq .Values.config.deploymentMode "gateway" }}
  CLOUD_SERVICE_URL: {{ .Values.config.gateway.cloudServiceUrl | quote }}
  {{- end }}
