# Default values for skill-mcp.
# This file documents every knob the chart exposes; override with `--values`
# or `--set` at install time. See README.md for full per-field rationale.

replicaCount: 1

image:
  repository: ghcr.io/becrafter/skill-mcp
  pullPolicy: IfNotPresent
  # Override the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Skill-MCP runtime configuration. These map 1:1 to env vars documented in
# CLAUDE.md "Environment Variables Reference"; see README.md for canonical list.
config:
  # standalone | gateway | cloud (cloud requires transport=http)
  deploymentMode: standalone
  # When true, /api/admin/* is disabled (production read-only MCP endpoint).
  mcpOnlyMode: false
  logLevel: info

  storage:
    # local-fs | aliyun-oss
    type: local-fs
    basePath: /var/lib/skill-mcp/data/skills
    # When type=aliyun-oss, populate via secret (see secrets.aliyun below).
    bucket: ""
    region: ""

  database:
    # SQLite path (DATABASE_PATH). For PG, set this to a postgres:// URL
    # — note: §3.1.1 PG schema port is P1, the runtime currently fail-fasts
    # on postgres:// URLs.
    path: /var/lib/skill-mcp/data/skill-mcp.db
    timeoutMs: 5000

  transport:
    # stdio | sse | http. Helm chart targets http (k8s service shape).
    type: http
    port: 3000
    host: 0.0.0.0

  cache:
    memoryEnabled: true
    memoryMaxSize: 1000
    fileEnabled: true
    fileDir: /var/lib/skill-mcp/data/cache
    l2TtlMultiplier: 2

  security:
    injectionScan: true
    hstsEnabled: false  # set true only when fronted by TLS terminator

  rateLimit:
    enabled: true
    adminCapacity: 60
    adminRefillPerSec: 10
    gatewayCapacity: 120
    gatewayRefillPerSec: 20

  # Gateway mode only.
  gateway:
    cloudServiceUrl: ""

# Sensitive values are loaded into a Secret. Default `create: true` builds a
# Secret from the values below; set create=false to reference an existing
# Secret by name (e.g. one managed by sealed-secret / external-secrets).
secrets:
  create: true
  existingSecret: ""
  # Bearer token used by stdio transport + admin auth fallback. Leave empty to
  # generate per-user tokens at runtime via the admin CLI.
  authToken: ""
  # Gateway → cloud-service auth token (for deploymentMode=gateway).
  gatewayAuthToken: ""
  aliyun:
    accessKeyId: ""
    accessKeySecret: ""

service:
  type: ClusterIP
  port: 3000
  # Optional — set to expose annotations for cloud LBs (NLB/ALB/GCLB).
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: skill-mcp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# k8s probes — wired to /api/v1/livez (liveness) and /api/v1/readyz
# (readiness). The split is mandatory: livez never touches the DB so a
# stuck DB cannot snowball into a kubelet restart loop, while readyz gates
# Service endpoint inclusion until DB.count() succeeds.
probes:
  liveness:
    path: /api/v1/livez
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /api/v1/readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    enabled: true
    path: /api/v1/livez
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30  # allow up to 150s for first start (migrations, cache warmup)

# Persistent storage for the SQLite DB + skill files + L2 cache. Strongly
# recommended in production: skills are user-uploaded artifacts, losing the
# PVC means losing customer data. Use `existingClaim` to wire to a
# pre-provisioned PVC managed elsewhere (terraform / argo).
persistence:
  enabled: true
  storageClass: ""  # "" = use cluster default
  accessMode: ReadWriteOnce
  size: 10Gi
  existingClaim: ""
  mountPath: /var/lib/skill-mcp/data

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Horizontal Pod Autoscaler. Off by default — at SQLite stage the database
# is single-writer, so scaling >1 replica without first switching to Postgres
# (P1 §3.1.1) will produce inconsistent behavior on writes.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  annotations: {}
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}

# Optional sidecars. Useful for pushing access logs to a side container
# tailing /var/lib/skill-mcp/data/logs.
extraContainers: []
extraVolumes: []
extraVolumeMounts: []
extraEnv: []
