version: '3.8'

services:
  # Storage Service (backend)
  #
  # NOTE: API-key auth has been replaced by per-user bearer tokens. Before
  # bringing this stack up, exec into the storage container once and run
  # `skill-mcp user create svc-gateway --role <role-with-needed-tags>`,
  # then export the printed token as $STORAGE_SVC_TOKEN in your shell or
  # .env so the gateway services below can authenticate with it.
  storage:
    image: skill-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      TRANSPORT_TYPE: http
      TRANSPORT_PORT: 3000
      DEPLOYMENT_MODE: standalone
      MCP_ONLY_MODE: "true"
      STORAGE_TYPE: local-fs
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    volumes:
      - storage-data:/app/data
    restart: unless-stopped
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Authorization: Bearer ${STORAGE_SVC_TOKEN:?STORAGE_SVC_TOKEN must be set — bootstrap with `skill-mcp user create svc-gateway`}", "http://localhost:3000/api/gateway/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # MCP Service 1
  mcp-1:
    image: skill-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      TRANSPORT_TYPE: http
      TRANSPORT_PORT: 4001
      DEPLOYMENT_MODE: gateway
      CLOUD_SERVICE_URL: http://storage:3000
      AUTH_TOKEN: ${STORAGE_SVC_TOKEN:?STORAGE_SVC_TOKEN must be set — bootstrap with `skill-mcp user create svc-gateway`}
      MCP_ONLY_MODE: "true"
      LOG_LEVEL: debug
    ports:
      - "4001:4001"
    volumes:
      - mcp-1-cache:/app/data
    restart: unless-stopped
    networks:
      - internal
      - external
    depends_on:
      storage:
        condition: service_healthy

  # MCP Service 2 (optional - for load balancing demo)
  mcp-2:
    image: skill-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      TRANSPORT_TYPE: http
      TRANSPORT_PORT: 4002
      DEPLOYMENT_MODE: gateway
      CLOUD_SERVICE_URL: http://storage:3000
      AUTH_TOKEN: ${STORAGE_SVC_TOKEN:?STORAGE_SVC_TOKEN must be set — bootstrap with `skill-mcp user create svc-gateway`}
      MCP_ONLY_MODE: "true"
      LOG_LEVEL: debug
    ports:
      - "4002:4002"
    volumes:
      - mcp-2-cache:/app/data
    restart: unless-stopped
    networks:
      - internal
      - external
    depends_on:
      storage:
        condition: service_healthy
    profiles:
      - scale

  # Nginx Load Balancer (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - external
    depends_on:
      - mcp-1
      - mcp-2
    profiles:
      - nginx

volumes:
  storage-data:
  mcp-1-cache:
  mcp-2-cache:

networks:
  internal:
    internal: true
  external: